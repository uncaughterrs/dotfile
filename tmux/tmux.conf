set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -gq allow-passthrough on

set -g base-index 1
set -g pane-base-index 1

set-option -g prefix C-a
set-option -g prefix2 none


unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind = split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z


bind s choose-session

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection


bind-key n command-prompt "new-session -s '%%'"

unbind -T copy-mode-vi MouseDragEnd1Pane

set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin "christoomey/vim-tmux-navigator"

set -g @plugin 'wfxr/tmux-power'

# Configure tmux-power (Catppuccin Mocha)
set -g @tmux_power_theme '#cba6f7'
set -g @tmux_power_g0 '#11111b'
set -g @tmux_power_g1 '#181825'
set -g @tmux_power_g2 '#313244'
set -g @tmux_power_g3 '#6c7086'
set -g @tmux_power_g4 '#cdd6f4'
set -g @tmux_power_left_a '#{=/-36/...:#{b:pane_current_path}}'
set -g @tmux_power_left_b ''
set -g @tmux_power_left_c ''
set -g @tmux_power_left_d ''
set -g @tmux_power_right_w ''
set -g @tmux_power_right_x ''
set -g @tmux_power_right_y ''
set -g @tmux_power_right_z ''
set -g @tmux_power_prefix_highlight_pos ''
set -g @tmux_power_status_interval 1

# bootstrap tpm
if "test ! -d ~/.config/tmux/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/.tmux/plugins/tpm && ~/.config/tmux/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'

# Configure Tmux
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=#11111b,fg=#a6adc8"
set -g status-left-length 80
set -g status-right-length 0
set -g status-right ""
set -g status-left "#[fg=#11111b,bg=#{?client_prefix,#a6e3a1,#cba6f7},bold] #{=/-36/...:#{b:pane_current_path}} #[fg=#{?client_prefix,#a6e3a1,#cba6f7},bg=#11111b]"

# Pane border
setw -g pane-border-status off
setw -g pane-active-border-style "fg=#cba6f7"
setw -g pane-border-style "fg=#313244"
set -g display-panes-active-colour "#cba6f7"
set -g display-panes-colour "#6c7086"
set -g mode-style "fg=#11111b,bg=#f9e2af,bold"

# Window naming
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-separator ""
set -g window-status-format "#[fg=#11111b,bg=#313244]#[fg=#cdd6f4,bg=#313244,bold] #I:#{=/-20/...:window_name} #[fg=#313244,bg=#11111b]"
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa]#[fg=#11111b,bg=#89b4fa,bold] #I:#{=/-20/...:window_name} #[fg=#89b4fa,bg=#11111b]"
